<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Student Management System</h1>
    <p>Java MVC + JDBC + MySQL</p>
</header>

<main class="container">
    <section class="card">
        <h2>Add Student</h2>
        <form action="students" method="post" onsubmit="return validateForm()">
            <input type="hidden" name="action" value="add">

            <div class="grid">
                <input id="name" name="name" type="text" placeholder="Student name" required>
                <input id="email" name="email" type="email" placeholder="Email" required>
                <input id="course" name="course" type="text" placeholder="Course" required>
                <input id="age" name="age" type="number" min="1" max="100" placeholder="Age" required>
                <input id="phone" name="phone" type="text" placeholder="Phone">
            </div>

            <button type="submit">Add Student</button>
        </form>
    </section>

    <section class="card">
        <div class="table-heading">
            <h2>Students</h2>
            <input id="search" type="search" placeholder="Search by name, email or course" oninput="filterStudents()">
        </div>

        <div class="table-wrapper">
            <table id="studentTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="studentBody">
                <tr>
                    <td colspan="7">Run the application through Tomcat to load students from MySQL.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>Student Management System • Learning Project</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
